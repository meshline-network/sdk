name: Pull request checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

defaults:
  run:
    working-directory: dotnet

jobs:
  documentation:
    name: Documentation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify API reference, compiled examples, and Markdown links
        shell: pwsh
        working-directory: .
        run: ./dotnet/docs/scripts/Invoke-Documentation.ps1 -Mode Check

  format:
    name: Code format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Meshline.Sdk.slnx

      - name: Verify code formatting
        run: dotnet format Meshline.Sdk.slnx --verify-no-changes --no-restore

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Meshline.Sdk.slnx

      - name: Build Release
        run: dotnet build Meshline.Sdk.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run the complete offline test suite
        run: >-
          dotnet run --project tests/Meshline.Sdk.Tests -c Release --no-build --
          --minimum-expected-tests 1 --fail-skips on --report-xunit-trx
          --results-directory "${{ runner.temp }}/test-results"
